<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深圳教师求职助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfbfa; --surface:#ffffff; --ink:#1c1c1a; --ink-soft:#56564f;
  --muted:#8c8c84; --line:#eaeae5; --line-strong:#d9d9d3;
  --primary:#2f7d6b; --primary-700:#256355; --primary-50:#eef4f2;
  --ok:#3f8f5f; --err:#b34a3f;
  --font:"Noto Sans SC", system-ui, -apple-system, sans-serif;
  --fs-xs:.78rem; --fs-sm:.875rem; --fs-base:1rem;
  --fs-lg:clamp(1.02rem,1rem+.2vw,1.15rem); --fs-xl:clamp(1.25rem,1.1rem+.7vw,1.5rem);
  --fs-2xl:clamp(1.7rem,1.4rem+1.6vw,2.4rem);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:64px; --s8:96px;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-pill:999px;
  --sh:0 1px 2px rgb(0 0 0 / .04); --ease:cubic-bezier(.22,1,.36,1);
  --t-fast:150ms var(--ease); --t:260ms var(--ease);
}
[data-theme="dark"]{
  --paper:#161619; --surface:#1d1d20; --ink:#f1f1ee; --ink-soft:#b6b6af;
  --muted:#7e7e77; --line:#2c2c30; --line-strong:#3b3b40;
  --primary:#5fae98; --primary-700:#7cc4b0; --primary-50:#1e2c29;
  --ok:#62a97c; --err:#cf6f64; --sh:0 1px 2px rgb(0 0 0 / .3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.65;
  font-size:var(--fs-base);-webkit-font-smoothing:antialiased;transition:background var(--t),color var(--t)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1080px;margin:0 auto;padding:var(--s3) var(--s5);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.brand{display:flex;align-items:center;gap:var(--s3)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-size:1.1rem;font-weight:700}
.brand-text{font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand-text small{display:block;font-weight:400;font-size:.64rem;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
.nav{display:flex;gap:2px;align-items:center}
.nav a{padding:var(--s2) var(--s3);border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--ink-soft);transition:color var(--t-fast),background var(--t-fast)}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--primary-700);font-weight:500}
.nav a[aria-current="page"]::after{content:"";display:block;height:2px;background:var(--primary);border-radius:2px;margin-top:3px}
.icon-btn{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;
  border:1px solid var(--line);color:var(--ink-soft);transition:var(--t-fast)}
.icon-btn:hover{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.wrap{max-width:1080px;margin:0 auto;padding:var(--s7) var(--s5) var(--s8)}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s3)}
h1.display{font-weight:700;font-size:var(--fs-2xl);line-height:1.2;letter-spacing:.01em}
.lede{color:var(--ink-soft);max-width:56ch;margin-top:var(--s3);font-size:var(--fs-lg)}
.btn{display:inline-flex;align-items:center;gap:var(--s2);justify-content:center;padding:var(--s3) var(--s4);
  border-radius:var(--r-sm);font-weight:500;font-size:var(--fs-sm);min-height:44px;transition:var(--t-fast)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-700);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary-700)}
.btn[disabled]{opacity:.5;pointer-events:none}
.search{display:flex;align-items:center;gap:var(--s3);background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r-pill);padding:var(--s3) var(--s4);margin-top:var(--s5);max-width:600px;transition:var(--t-fast)}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:none;background:none;font-size:var(--fs-base);color:var(--ink);outline:none}
.filters{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s5)}
.filter-group{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.filter-label{font-size:var(--fs-xs);color:var(--muted);width:3em;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:var(--s2) var(--s3);border-radius:var(--r-pill);
  border:1px solid var(--line-strong);font-size:var(--fs-sm);color:var(--ink-soft);background:var(--surface);transition:var(--t-fast)}
.chip:hover{border-color:var(--primary);color:var(--primary-700)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.meta-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--s5);color:var(--muted);font-size:var(--fs-sm)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s4);margin-top:var(--s4)}
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);
  display:flex;flex-direction:column;gap:var(--s3);transition:border-color var(--t),box-shadow var(--t)}
.job:hover{border-color:var(--line-strong);box-shadow:var(--sh)}
.job h3{font-size:var(--fs-lg);font-weight:700;line-height:1.35}
.job .org{color:var(--ink-soft);font-size:var(--fs-sm)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:var(--fs-xs);padding:3px 9px;border-radius:var(--r-pill);background:var(--paper);color:var(--ink-soft);border:1px solid var(--line)}
.tag.hot{background:var(--primary-50);color:var(--primary-700);border-color:transparent}
.job-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding-top:var(--s3);border-top:1px solid var(--line)}
.salary{font-weight:700;font-size:1.05rem}
.salary small{font-weight:500;font-size:.7rem;color:var(--muted)}
.deadline{font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;gap:5px}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);
  display:grid;grid-template-columns:auto 1fr;gap:var(--s5);align-items:center;transition:border-color var(--t)}
.scorecard:hover{border-color:var(--line-strong)}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring.null .bar{stroke:var(--line-strong)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column}
.ring .val b{font-size:1.6rem;font-weight:700;line-height:1}
.ring .val span{font-size:.62rem;color:var(--muted);letter-spacing:.08em}
.sc-body h3{font-size:var(--fs-lg);font-weight:700}
.sc-body .org{color:var(--ink-soft);font-size:var(--fs-sm);margin-bottom:var(--s2)}
.grade{display:inline-flex;align-items:center;font-weight:700;font-size:var(--fs-sm);
  padding:2px 10px;border-radius:var(--r-pill);background:var(--primary-50);color:var(--primary-700)}
.grade.low{background:var(--paper);color:var(--ink-soft)}
.grade.null{background:var(--paper);color:var(--muted)}
.reason{color:var(--ink-soft);font-size:var(--fs-sm);margin:var(--s3) 0;line-height:1.65}
.points{display:flex;flex-direction:column;gap:4px;margin:var(--s2) 0}
.points li{font-size:var(--fs-sm);color:var(--ink-soft);list-style:none;padding-left:18px;position:relative}
.points li::before{content:"+";position:absolute;left:4px;color:var(--ok);font-weight:700}
.points li.gap::before{content:"–";color:var(--err)}
.sc-actions{display:flex;gap:var(--s2);flex-wrap:wrap}
.qa{max-width:720px;display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s5)}
.bubble{padding:var(--s4) var(--s5);border-radius:var(--r-lg);max-width:86%}
.bubble.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.ai p{color:var(--ink-soft);line-height:1.7}
.bubble.ai p+p{margin-top:var(--s2)}
.cite{display:inline-flex;align-items:center;gap:5px;margin-top:var(--s3);font-size:var(--fs-xs);color:var(--primary-700);
  background:var(--primary-50);padding:4px 10px;border-radius:var(--r-pill)}
.askbar{display:flex;gap:var(--s2);margin-top:var(--s5);max-width:720px}
.askbar input{flex:1;padding:var(--s3) var(--s4);border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);font-size:var(--fs-base);color:var(--ink);transition:var(--t-fast)}
.askbar input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
.sugg{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3);max-width:720px}
.sugg button{font-size:var(--fs-xs);padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line);color:var(--ink-soft);transition:var(--t-fast)}
.sugg button:hover{border-color:var(--primary);color:var(--primary-700)}
.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--line);margin-bottom:var(--s6)}
.tab{padding:var(--s3) var(--s4);font-size:var(--fs-sm);color:var(--muted);transition:color var(--t-fast)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:500}
.tab[aria-selected="true"]::after{content:"";display:block;height:2px;background:var(--primary);border-radius:2px;margin-top:4px}
.panel{display:none;animation:fade var(--t) both}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.state{color:var(--muted);font-size:var(--fs-sm);padding:var(--s5);text-align:center;border:1px dashed var(--line);border-radius:var(--r);margin-top:var(--s4)}
.state.err{color:var(--err);border-color:var(--err)}
.job{cursor:pointer}
.job-cta{margin-top:var(--s2);font-size:var(--fs-xs);color:var(--primary-700)}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:var(--s5);background:rgb(0 0 0 / .4)}
.modal.open{display:flex}
.modal-card{position:relative;width:min(620px,100%);max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s6);box-shadow:0 20px 60px rgb(0 0 0 / .25);animation:fade var(--t) both}
.modal-close{position:absolute;top:var(--s4);right:var(--s4)}
.job-detail h2{font-size:var(--fs-xl);font-weight:700;margin-bottom:var(--s2);line-height:1.3}
.job-detail .org{color:var(--ink-soft);font-size:var(--fs-sm);margin-bottom:var(--s4)}
.job-detail .tags{margin-bottom:var(--s4)}
.job-detail .desc{color:var(--ink-soft);line-height:1.8;font-size:var(--fs-sm);white-space:pre-wrap}
.job-detail .desc:empty::before{content:"该岗位暂未录入公告详情。";color:var(--muted)}
.detail-actions{display:flex;gap:var(--s2);margin-top:var(--s5);align-items:center;flex-wrap:wrap}
@media (max-width:680px){
  .topbar-inner{padding:var(--s3) var(--s4)}
  .brand-text small{display:none}
  .nav a{padding:var(--s2)}
  .wrap{padding:var(--s6) var(--s4) var(--s7)}
  .scorecard{grid-template-columns:1fr;justify-items:start;gap:var(--s4)}
  .filter-label{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/web/redesign.html">
      <span class="brand-mark">师</span>
      <span class="brand-text">深圳教师求职助手<small>Teacher Finder</small></span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="#" data-nav="jobs" aria-current="page">岗位</a>
      <a href="#" data-nav="recommend">推荐</a>
      <a href="#" data-nav="ask">问答</a>
      <a href="#" data-nav="apps">投递</a>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="切换深浅主题" title="切换深浅主题">
      <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<main class="wrap">
  <p class="eyebrow">深圳教师求职助手</p>
  <h1 class="display">让找工作的每一步都看得清</h1>
  <p class="lede">规则层先按硬条件粗筛，再由大模型逐岗打分写评语。所有数据均来自真实后端接口。</p>

  <div class="tabs" role="tablist" aria-label="主功能" style="margin-top:var(--s6)">
    <button class="tab" role="tab" aria-selected="true"  data-tab="jobs"     id="tab-jobs">岗位浏览</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="recommend" id="tab-recommend">AI 匹配成绩单</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="ask"      id="tab-ask">公告问答</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="apps"     id="tab-apps">投递记录</button>
  </div>

  <!-- 岗位 -->
  <section class="panel active" id="panel-jobs" role="tabpanel" aria-labelledby="tab-jobs">
    <div class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17.5 17.5" stroke-linecap="round"/></svg>
      <input type="search" id="jobSearch" placeholder="搜学校、区域、学科，如「南山 语文」" aria-label="搜索岗位">
    </div>
    <div class="filters" id="filters">
      <div class="filter-group" data-fkey="district"><span class="filter-label">区域</span>
        <button class="chip" aria-pressed="false" data-value="南山区">南山</button>
        <button class="chip" aria-pressed="false" data-value="福田区">福田</button>
        <button class="chip" aria-pressed="false" data-value="宝安区">宝安</button>
        <button class="chip" aria-pressed="false" data-value="龙岗区">龙岗</button>
        <button class="chip" aria-pressed="false" data-value="罗湖区">罗湖</button>
        <button class="chip" aria-pressed="false" data-value="龙华区">龙华</button>
        <button class="chip" aria-pressed="false" data-value="坪山区">坪山</button>
        <button class="chip" aria-pressed="false" data-value="光明区">光明</button>
      </div>
      <div class="filter-group" data-fkey="stage"><span class="filter-label">学段</span>
        <button class="chip" aria-pressed="false" data-value="小学">小学</button>
        <button class="chip" aria-pressed="false" data-value="初中">初中</button>
        <button class="chip" aria-pressed="false" data-value="高中">高中</button>
      </div>
      <div class="filter-group" data-fkey="subject"><span class="filter-label">学科</span>
        <button class="chip" aria-pressed="false" data-value="语文">语文</button>
        <button class="chip" aria-pressed="false" data-value="数学">数学</button>
        <button class="chip" aria-pressed="false" data-value="英语">英语</button>
        <button class="chip" aria-pressed="false" data-value="物理">物理</button>
        <button class="chip" aria-pressed="false" data-value="化学">化学</button>
        <button class="chip" aria-pressed="false" data-value="美术">美术</button>
        <button class="chip" aria-pressed="false" data-value="信息技术">信息技术</button>
      </div>
      <div class="filter-group" data-fkey="establishment"><span class="filter-label">编制</span>
        <button class="chip" aria-pressed="false" data-value="true">编制内</button>
        <button class="chip" aria-pressed="false" data-value="false">非编制</button>
      </div>
    </div>
    <div class="meta-row"><span id="jobCount">加载中…</span><span>数据来自真实后端</span></div>
    <div class="grid" id="jobGrid"></div>
  </section>

  <!-- 推荐 -->
  <section class="panel" id="panel-recommend" role="tabpanel" aria-labelledby="tab-recommend">
    <p class="lede" style="margin-top:0">规则层先按硬条件粗筛，DeepSeek 再逐岗打分写评语。投递始终由你最终确认。</p>
    <div class="sc-actions" style="margin-top:var(--s4)">
      <button class="btn btn-primary" id="rescoreBtn">重新评分</button>
      <span id="rescoreStatus" style="color:var(--muted);font-size:var(--fs-sm)"></span>
    </div>
    <div id="recList" style="display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s5)"></div>
  </section>

  <!-- 问答 -->
  <section class="panel" id="panel-ask" role="tabpanel" aria-labelledby="tab-ask">
    <div class="askbar">
      <input type="text" id="askInput" placeholder="问公告里的事，比如报名材料、面试比例、资格条件…" aria-label="向公告提问">
      <button class="btn btn-primary" id="askBtn">提问</button>
    </div>
    <div class="sugg">
      <button>报名需要哪些材料？</button>
      <button>面试比例是多少？</button>
      <button>应届生能报吗？</button>
      <button>有编制吗？</button>
    </div>
    <div class="qa" id="qa"></div>
  </section>

  <!-- 投递记录 -->
  <section class="panel" id="panel-apps" role="tabpanel" aria-labelledby="tab-apps">
    <p class="lede" style="margin-top:0">你确认投递过的岗位都记在这里。投递动作默认由你主动触发，系统不会全自动群发。</p>
    <div class="sc-actions" style="margin-top:var(--s4)">
      <button class="btn btn-ghost" id="refreshApps">刷新投递记录</button>
    </div>
    <div id="appList" style="display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s4)"></div>
  </section>

  <!-- 岗位详情弹窗 -->
  <div class="modal" id="jobModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
      <button class="icon-btn modal-close" id="jobModalClose" aria-label="关闭">✕</button>
      <div id="jobModalBody"></div>
    </div>
  </div>
</main>

<script>
const root = document.documentElement;
const $ = (s, el=document) => el.querySelector(s);
const token = localStorage.getItem('tf_token');

async function api(path, opts={}) {
  const headers = {'Content-Type': 'application/json'};
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(path, {...opts, headers});
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

/* ---------- 岗位 ---------- */
const typeLabel = { public: '公办', private: '民办' };
const filters = { district: null, stage: null, subject: null, establishment: null };
let allJobs = [];

function fmtSalary(j) {
  if (j.salary_min == null && j.salary_max == null) return '薪资面议';
  const lo = j.salary_min != null ? Math.round(j.salary_min / 1000) + 'k' : '面议';
  const hi = j.salary_max != null ? Math.round(j.salary_max / 1000) + 'k' : '';
  return lo + (hi ? '–' + hi : '') + ' /月';
}
function fmtDeadline(d) {
  if (!d) return '长期有效';
  const [y, m, day] = d.split('-');
  const expired = new Date(d) < new Date(new Date().toDateString());
  return (expired ? '已截止 ' : '截止 ') + `${m}-${day}`;
}
function jobTitle(j) {
  if (j.stage && j.subject) return `${j.stage}${j.subject}教师`;
  return j.school_name || '教师岗位';
}
function jobCard(j) {
  const title = jobTitle(j);
  const org = title === j.school_name ? (typeLabel[j.school_type] || '') : j.school_name;
  const tags = [];
  if (j.is_establishment) tags.push('<span class="tag hot">编制内</span>');
  else if (j.is_establishment === false) tags.push('<span class="tag">非编制</span>');
  if (j.district) tags.push(`<span class="tag">${j.district.replace('区','')}</span>`);
  if (j.stage) tags.push(`<span class="tag">${j.stage}</span>`);
  if (j.subject) tags.push(`<span class="tag">${j.subject}</span>`);
  return `<article class="job" data-job-id="${j.id}">
    <div><h3>${title}</h3><div class="org">${org}${typeLabel[j.school_type] ? ' · ' + typeLabel[j.school_type] : ''}</div></div>
    <div class="tags">${tags.join('')}</div>
    <div class="job-foot"><div class="salary num">${fmtSalary(j)}</div><div class="deadline">📅 ${fmtDeadline(j.deadline)}</div></div>
    <div class="job-cta">点击查看岗位详情 ›</div>
  </article>`;
}
function renderJobs() {
  const q = $('#jobSearch').value.trim().toLowerCase();
  const list = allJobs.filter(j => {
    if (!q) return true;
    const hay = (j.school_name + ' ' + j.district + ' ' + j.subject + ' ' + j.stage).toLowerCase();
    return hay.includes(q);
  });
  $('#jobCount').innerHTML = `共 <b class="num">${allJobs.length}</b> 个岗位 · 当前显示 <b class="num">${list.length}</b> 个`;
  $('#jobGrid').innerHTML = list.length
    ? list.map(jobCard).join('')
    : '<div class="state">没有符合当前筛选的岗位，试试放宽条件。</div>';
}
async function loadJobs() {
  const p = new URLSearchParams({ include_expired: 'true', size: '100' });
  if (filters.district) p.set('district', filters.district);
  if (filters.stage) p.set('stage', filters.stage);
  if (filters.subject) p.set('subject', filters.subject);
  if (filters.establishment != null) p.set('is_establishment', filters.establishment);
  $('#jobGrid').innerHTML = '<div class="state">加载中…</div>';
  try {
    allJobs = await api(`/jobs?${p}`);
    renderJobs();
  } catch (e) {
    $('#jobGrid').innerHTML = `<div class="state err">岗位加载失败：${e.message}（请确认后端已启动）</div>`;
  }
}
$('#filters').querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  const grp = c.closest('.filter-group').dataset.fkey;
  const val = c.dataset.value;
  const pressed = c.getAttribute('aria-pressed') === 'true';
  c.parentElement.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', 'false'));
  if (!pressed) { c.setAttribute('aria-pressed', 'true'); filters[grp] = grp === 'establishment' ? (val === 'true') : val; }
  else { filters[grp] = null; }
  loadJobs();
}));
$('#jobSearch').addEventListener('input', renderJobs);

/* ---------- 推荐 ---------- */
function gradeOf(s) {
  if (s == null) return { txt: '待 LLM 评分', cls: 'null' };
  if (s >= 85) return { txt: 'A · 高度契合', cls: '' };
  if (s >= 70) return { txt: 'B · 条件良好', cls: '' };
  if (s >= 55) return { txt: 'C · 基本符合', cls: 'low' };
  return { txt: 'D · 差距较大', cls: 'low' };
}
function scorecard(m) {
  const j = m.job || {};
  const title = jobTitle(j) === j.school_name ? j.school_name : `${jobTitle(j)} · ${j.school_name}`;
  const g = gradeOf(m.llm_score);
  const hasScore = m.llm_score != null;
  const C = 264, off = hasScore ? C * (1 - m.llm_score / 100) : C;
  const pts = [];
  (m.matched_points || []).forEach(p => pts.push(`<li>${p}</li>`));
  (m.gaps || []).forEach(p => pts.push(`<li class="gap">${p}</li>`));
  const reason = m.match_reason || (hasScore ? '大模型已给出匹配评分。' : '规则层已匹配，DeepSeek 评分待接入真实密钥后生成。');
  return `<article class="scorecard">
    <div class="ring ${hasScore ? '' : 'null'}" data-score="${hasScore ? m.llm_score : 0}">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle class="track" cx="48" cy="48" r="42" fill="none" stroke-width="8"/>
        <circle class="bar" cx="48" cy="48" r="42" fill="none" stroke-width="8"
                stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
      </svg>
      <div class="val"><b class="num">${hasScore ? m.llm_score : '—'}</b><span>匹配分</span></div>
    </div>
    <div class="sc-body">
      <h3>${title}</h3>
      <div class="org">${(j.is_establishment ? '编制内' : '非编制')} · ${j.district || ''} · ${j.stage || ''} · ${j.subject || ''}</div>
      <span class="grade ${g.cls}">${g.txt}</span>
      <p class="reason">${reason}</p>
      ${pts.length ? `<ul class="points">${pts.join('')}</ul>` : ''}
      <div class="sc-actions"><button class="btn btn-ghost" data-job-id="${j.id}">查看岗位详情</button></div>
    </div>
  </article>`;
}
async function loadRecommendations() {
  const el = $('#recList');
  el.innerHTML = '<div class="state">加载中…</div>';
  try {
    const list = await api('/recommendations?include_expired=true');
    if (!list.length) { el.innerHTML = '<div class="state">暂无匹配结果。可先完善求职意向，或在「岗位浏览」中直接查看。</div>'; return; }
    el.innerHTML = list.map(scorecard).join('');
    requestAnimationFrame(animateRings);
  } catch (e) {
    el.innerHTML = `<div class="state err">匹配加载失败：${e.message}</div>`;
  }
}

/* ---------- 问答 ---------- */
async function ask(q) {
  q = (q || '').trim();
  if (!q) return;
  const qa = $('#qa');
  qa.insertAdjacentHTML('beforeend', `<div class="bubble user">${q.replace(/</g,'&lt;')}</div>`);
  const loading = document.createElement('div');
  loading.className = 'bubble ai';
  loading.innerHTML = '<p>正在检索公告…</p>';
  qa.appendChild(loading);
  $('#askInput').value = '';
  try {
    const r = await api('/rag/ask', { method: 'POST', body: JSON.stringify({ question: q }) });
    const cites = (r.sources || []).map(s => `<span class="cite">📎 出处：${s.title}</span>`).join('');
    loading.innerHTML = `<p>${r.answer.replace(/</g,'&lt;')}</p>${cites}`;
  } catch (e) {
    loading.innerHTML = `<p class="state err">问答失败：${e.message}</p>`;
  }
}
$('#askBtn').addEventListener('click', () => ask($('#askInput').value));
$('#askInput').addEventListener('keydown', e => { if (e.key === 'Enter') ask($('#askInput').value); });
document.querySelectorAll('.sugg button').forEach(b => b.addEventListener('click', () => ask(b.textContent)));

/* ---------- 环动画 ---------- */
function animateRings() {
  document.querySelectorAll('.ring').forEach(r => {
    const score = +r.dataset.score, C = 264, off = C * (1 - score / 100), bar = r.querySelector('.bar');
    if (r.classList.contains('null')) return;
    bar.style.strokeDashoffset = C;
    requestAnimationFrame(() => requestAnimationFrame(() => bar.style.strokeDashoffset = off));
  });
}

/* ---------- Tabs / 主题 ---------- */
const panels = { jobs: 'panel-jobs', recommend: 'panel-recommend', ask: 'panel-ask', apps: 'panel-apps' };
const tabs = document.querySelectorAll('.tab');
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.setAttribute('aria-selected', 'false'));
  t.setAttribute('aria-selected', 'true');
  Object.values(panels).forEach(id => $('#' + id).classList.remove('active'));
  $('#' + panels[t.dataset.tab]).classList.add('active');
  if (t.dataset.tab === 'recommend') loadRecommendations();
  if (t.dataset.tab === 'apps') loadApps();
}));
document.querySelectorAll('.nav a').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  document.querySelectorAll('.nav a').forEach(x => x.removeAttribute('aria-current'));
  a.setAttribute('aria-current', 'page');
  document.querySelector(`.tab[data-tab="${a.dataset.nav}"]`).click();
}));
const themeBtn = $('#themeBtn');
const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
const saved = localStorage.getItem('tf_theme');
if (saved) root.setAttribute('data-theme', saved);
$('#themeIcon').innerHTML = root.getAttribute('data-theme') === 'dark' ? moon : sun;
themeBtn.addEventListener('click', () => {
  const dark = root.getAttribute('data-theme') === 'dark';
  const next = dark ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('tf_theme', next);
  $('#themeIcon').innerHTML = next === 'dark' ? moon : sun;
});

/* ---------- 岗位详情 / 投递 ---------- */
const jobCache = {};
function jobTags(j) {
  const tags = [];
  if (j.is_establishment) tags.push('<span class="tag hot">编制内</span>');
  else if (j.is_establishment === false) tags.push('<span class="tag">非编制</span>');
  if (j.district) tags.push(`<span class="tag">${j.district.replace('区','')}</span>`);
  if (j.stage) tags.push(`<span class="tag">${j.stage}</span>`);
  if (j.subject) tags.push(`<span class="tag">${j.subject}</span>`);
  return tags.join('');
}
async function openJob(id) {
  const body = $('#jobModalBody');
  body.innerHTML = '<div class="state">加载中…</div>';
  $('#jobModal').classList.add('open');
  $('#jobModal').setAttribute('aria-hidden', 'false');
  try {
    const j = await api(`/jobs/${id}`);
    jobCache[id] = j;
    const title = jobTitle(j);
    const org = (j.school_type ? typeLabel[j.school_type] + ' · ' : '') + j.school_name;
    body.innerHTML = `<div class="job-detail">
      <h2 id="jobModalTitle">${title} · ${j.school_name}</h2>
      <div class="org">${org}</div>
      <div class="tags">${jobTags(j)}</div>
      <div class="job-foot" style="border:none;padding:0;margin:0 0 var(--s4)">
        <div class="salary num">${fmtSalary(j)}</div>
        <div class="deadline">📅 ${fmtDeadline(j.deadline)}</div>
      </div>
      <div class="eyebrow" style="margin-bottom:var(--s2)">岗位公告 / 描述</div>
      <div class="desc">${j.description ? j.description.replace(/</g,'&lt;') : ''}</div>
      <div class="detail-actions">
        <button class="btn btn-primary" id="applyBtn" data-job-id="${j.id}">投递此岗位</button>
      </div>
    </div>`;
    $('#applyBtn').addEventListener('click', () => applyJob(j.id));
  } catch (e) {
    body.innerHTML = `<div class="state err">岗位详情加载失败：${e.message}</div>`;
  }
}
function closeJob() {
  $('#jobModal').classList.remove('open');
  $('#jobModal').setAttribute('aria-hidden', 'true');
}
$('#jobModalClose').addEventListener('click', closeJob);
$('#jobModal').addEventListener('click', e => { if (e.target === $('#jobModal')) closeJob(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#jobModal').classList.contains('open')) closeJob(); });

async function applyJob(id) {
  const btn = $('#applyBtn');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '投递中…';
  try {
    await api('/applications', { method: 'POST', body: JSON.stringify({ job_id: id }) });
    btn.textContent = '已投递 ✓';
    loadApps();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = orig;
    const d = btn.closest('.detail-actions');
    let note = d.querySelector('.apply-note');
    if (!note) { note = document.createElement('span'); note.className = 'apply-note'; d.appendChild(note); }
    note.style.color = 'var(--err)';
    note.style.fontSize = 'var(--fs-sm)';
    note.textContent = '投递失败：' + e.message;
  }
}

/* ---------- 投递记录 ---------- */
function statusLabel(s) { return ({ PENDING: '待发送', SENT: '已发送', FAILED: '发送失败' })[s] || s; }
function appRow(a) {
  const j = jobCache[a.job_id] || {};
  const title = j.school_name ? `${jobTitle(j)} · ${j.school_name}` : `岗位 ${a.job_id.slice(0, 8)}`;
  const sent = a.sent_at ? new Date(a.sent_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  const cls = a.status === 'SENT' ? '' : (a.status === 'FAILED' ? 'null' : 'low');
  return `<article class="scorecard" style="grid-template-columns:1fr">
    <div class="sc-body">
      <h3>${title}</h3>
      <div class="org">${a.recipient_email} · <span class="grade ${cls}">${statusLabel(a.status)}</span> · ${sent}</div>
      ${a.error_msg ? `<p class="reason" style="color:var(--err)">${a.error_msg}</p>` : ''}
    </div>
  </article>`;
}
async function loadApps() {
  const el = $('#appList');
  el.innerHTML = '<div class="state">加载中…</div>';
  try {
    const list = await api('/applications');
    if (!list.length) { el.innerHTML = '<div class="state">还没有投递记录。在「岗位浏览」点开岗位即可投递。</div>'; return; }
    el.innerHTML = list.map(appRow).join('');
  } catch (e) {
    el.innerHTML = `<div class="state err">投递记录加载失败：${e.message}</div>`;
  }
}
$('#refreshApps').addEventListener('click', loadApps);

/* ---------- 重新评分 ---------- */
async function rescore() {
  const btn = $('#rescoreBtn'), status = $('#rescoreStatus');
  btn.disabled = true;
  status.textContent = '正在发起评分…';
  try {
    const r = await api('/matches/refresh', { method: 'POST' });
    if (r.mode === 'async') {
      status.textContent = '评分任务已入队，等待大模型处理…';
      await pollRefresh(r.task_id, status, btn);
    } else {
      status.textContent = '评分已完成。';
      await loadRecommendations();
      setTimeout(() => { status.textContent = ''; }, 2500);
      btn.disabled = false;
    }
  } catch (e) {
    status.textContent = '评分失败：' + e.message;
    btn.disabled = false;
  }
}
async function pollRefresh(taskId, status, btn) {
  for (let i = 0; i < 60; i++) {
    await new Promise(res => setTimeout(res, 1000));
    let s;
    try { s = await api(`/matches/refresh/${taskId}`); }
    catch (e) { status.textContent = '查询进度失败：' + e.message; btn.disabled = false; return; }
    const st = s.status;
    if (st === 'done') {
      status.textContent = '评分完成，正在刷新…';
      await loadRecommendations();
      setTimeout(() => { status.textContent = ''; }, 2500);
      btn.disabled = false;
      return;
    }
    if (st === 'rejected' || st === 'failed' || st === 'stalled') {
      status.textContent = '评分未成功：' + (s.message || st);
      btn.disabled = false;
      return;
    }
    const prog = s.total ? `（${s.done || 0}/${s.total}）` : '';
    status.textContent = '评分中…' + prog;
  }
  status.textContent = '评分超时，请稍后手动刷新。';
  btn.disabled = false;
}
$('#rescoreBtn').addEventListener('click', rescore);

/* ---------- 卡片点击打开详情 ---------- */
$('#jobGrid').addEventListener('click', e => { const c = e.target.closest('.job'); if (c && c.dataset.jobId) openJob(c.dataset.jobId); });
$('#recList').addEventListener('click', e => { const b = e.target.closest('[data-job-id]'); if (b) openJob(b.dataset.jobId); });

loadJobs();
</script>
</body>
