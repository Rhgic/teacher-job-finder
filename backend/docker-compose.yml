# 本地开发环境：一条命令起 MySQL + Redis。
#   docker compose up -d
#   docker compose ps          # 等两个都变成 healthy
# 连接串（写进 .env）：
#   DATABASE_URL=mysql+pymysql://teacher:teacher_dev_pwd@127.0.0.1:3306/teacher_jobs?charset=utf8mb4
#   REDIS_URL=redis://127.0.0.1:6379/0
services:
  db:
    image: mysql:8.0
    container_name: teacher-jobs-mysql
    restart: unless-stopped
    environment:
      # 本地未配置时保留开发默认值；服务器必须在 .env 里覆盖成随机值。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teacher_jobs}
      MYSQL_USER: ${MYSQL_USER:-teacher}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-teacher_dev_pwd}
      TZ: Asia/Shanghai
    # 建库即 utf8mb4，避免中文/emoji 落库出错；
    # MYSQL_DATABASE 自动建的库会继承这里的服务端默认字符集。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      # 只给宿主机上的 API 使用，不把数据库端口暴露到公网。
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 用真实登录探活，而不是只看端口，避免"端口通了但还没初始化完"
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: teacher-jobs-redis
    restart: unless-stopped
    # 配额与限流计数丢了会放行超额请求，比丢缓存严重，
    # 因此开 AOF 持久化（everysec 兼顾安全与写入性能）。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      # 计数器不能被内存压力淘汰，只淘汰设了 TTL 的缓存键
      - --maxmemory-policy
      - volatile-lru
    ports:
      # Redis 无认证，仅允许宿主机访问，绝不能直接暴露公网。
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mysql_data:
  redis_data:
