# Ruff 配置：CI 与本地共用同一套规则，避免"本地过了 CI 挂"。
# 与 Dockerfile 的 python:3.12-slim 对齐，避免 CI 放行部署环境跑不了的语法。
target-version = "py312"
line-length = 100

[lint]
# E4/E7/E9 + F 是默认集（导入、语法、未定义名等硬错误）。
# B = flake8-bugbear，抓真实缺陷而非风格问题。
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# scripts/ 下的脚本要先把项目根塞进 sys.path 才能 import 项目模块，
# 这类 import 必然在文件中段，E402 属预期行为。
"scripts/*" = ["E402"]

[lint.flake8-bugbear]
# FastAPI 的依赖注入就是靠"在参数默认值里调用"表达的，
# 不是 B008 想抓的可变默认值缺陷，故声明为不可变调用。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]
