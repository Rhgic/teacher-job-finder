[project]
name = "cross-border-agent-ui"
version = "1.0.0"
description = "跨境售后客服 Agent · 面试级 MVP（演示数据，不接真实平台）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # 直接用 bcrypt 而非 passlib：passlib 1.7.4 与 bcrypt 4.x 存在已知版本探测问题，
    # 这里只需 hashpw/checkpw 两个调用，少一层封装少一个故障点。
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "python-json-logger>=2.0",
    "pytest>=8.2",
    # pytest 的终端输出在当前支持的 pytest 版本中会导入它，显式声明避免全局环境偶然可用。
    "pygments>=2.18",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 tests 能直接 import app.*
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008 = 不要在默认参数里调用函数。但 FastAPI 的依赖注入就是这么写的
# （`user: User = Depends(get_current_user)`），这是框架惯例而非疏忽。
# 刻意只豁免这一条，不整体降低 B 规则集。
ignore = ["B008"]

[tool.uv]
package = false
