# V1 只需要一个 PostgreSQL；不引入 Redis、向量库或消息队列（理由见 ARCHITECTURE.md）。
services:
  db:
    # V1 只需要标准 PostgreSQL 16：检索用关键词打分，不依赖任何向量扩展
    #（为什么不上向量库，见 ARCHITECTURE.md）。
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cbagent
      POSTGRES_PASSWORD: cbagent
      POSTGRES_DB: cbagent
    # 用 5433 避开本机其它项目常占的 5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbagent -d cbagent"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - cbagent_pgdata:/var/lib/postgresql/data

volumes:
  cbagent_pgdata:
