name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新推送时取消尚未跑完的旧任务，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 代码检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 backend/Dockerfile 的 python:3.12-slim 保持一致，
          # 否则 CI 绿了也不能保证部署环境跑得起来。
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码检查（ruff）
        working-directory: backend
        run: ruff check .

      - name: 单元测试（pytest）
        working-directory: backend
        # 测试跑在 SQLite 上，不依赖 MySQL 与任何外部密钥。
        run: python -m pytest -q

  miniprogram:
    name: 小程序 · 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 静态自检
        working-directory: miniprogram
        # --static 跳过"需要后端在跑"的健康检查，那部分由 smoke 任务覆盖。
        run: node scripts/check-all.mjs --static

  smoke:
    name: 端到端冒烟 · 零外部依赖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 灌入种子数据
        working-directory: backend
        # 不设任何环境变量，走 config.py 的默认值：
        # SQLite + LLM_STUB_MODE=1 + EMBEDDING_STUB_MODE=1 + MAILER_DRY_RUN=1。
        # 这一步同时守住了"无外部密钥也必须能端到端跑通"这条约定——
        # 哪天有人把某个功能改成强依赖外部服务，这里会先红。
        run: python seed.py

      - name: 启动后端
        working-directory: backend
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "后端就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "后端 30 秒内未就绪，日志如下："
          cat server.log
          exit 1

      - name: 接口冒烟检查
        working-directory: miniprogram
        # 覆盖 /health、/readiness、/jobs、/settings/*、已截止岗位投递防线、
        # /auth/login 挂载情况。
        run: node scripts/dev-health-check.mjs

      - name: 指标端点可用
        run: |
          curl -sf http://127.0.0.1:8000/metrics | grep -q "http_requests_total" \
            || { echo "/metrics 没有输出 http_requests_total"; exit 1; }

      - name: 失败时上传后端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-server-log
          path: backend/server.log
          if-no-files-found: ignore
