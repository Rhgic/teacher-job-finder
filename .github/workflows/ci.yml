name: CI

# Python 版本统一取 3.12，与 backend/Dockerfile 的 python:3.12-slim 对齐。
# CI 绿而线上崩最常见的原因就是两边跑在不同小版本上，这里不留这个缝。
on:
  push:
    branches: [main, v2, master]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///./ci_test.db"
      LLM_STUB_MODE: "1"
      EMBEDDING_STUB_MODE: "1"
      AUTH_DEV_MODE: "1"
      MAILER_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

      - name: 迁移与模型一致性
        env:
          DATABASE_URL: "sqlite:///./ci_migration_check.db"
        # 先按迁移建库，再让 alembic 比对模型与库结构。
        # 有人改了 models.py 却没写迁移的话，check 会报出差异并让 CI 失败——
        # 否则这种漂移要等到上线执行迁移时才暴露。
        run: |
          alembic upgrade head
          alembic check

  smoke:
    name: 端到端冒烟 · 零外部依赖
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 灌入种子数据
        # 不设任何环境变量，走 config.py 的默认值：
        # SQLite + LLM_STUB_MODE=1 + EMBEDDING_STUB_MODE=1 + MAILER_DRY_RUN=1。
        # 这一步同时守住了"无外部密钥也必须能端到端跑通"这条约定——
        # 哪天有人把某个功能改成强依赖外部服务，这里会先红。
        run: python seed.py

      - name: 启动后端
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "后端就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "后端 30 秒内未就绪，日志如下："
          cat server.log
          exit 1

      - name: 关键接口可用
        # README 承诺"不配任何外部密钥就能端到端跑通"，这里逐个兑现。
        run: |
          set -e
          curl -sf http://127.0.0.1:8000/health > /dev/null
          curl -sf http://127.0.0.1:8000/readiness > /dev/null
          curl -sf "http://127.0.0.1:8000/jobs?limit=5" > /dev/null
          echo "健康检查与岗位列表 OK"

      - name: 首页跳转必须落到真实页面
        # 根路由改过跳转目标却没人发现的事发生过一次，这里守住。
        run: |
          set -e
          target=$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8000/)
          echo "根路由跳往 ${target}"
          curl -sf "${target}" > /dev/null

      - name: 指标端点可用
        run: |
          curl -sf http://127.0.0.1:8000/metrics | grep -q "http_requests_total" \
            || { echo "/metrics 没有输出 http_requests_total"; exit 1; }

      - name: 失败时上传后端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-server-log
          path: backend/server.log
          if-no-files-found: ignore
